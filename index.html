<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="converter-container">

        <div class="converter-card">

            <div class="header">
                <div class="icon">💱</div>

                <h1>Currency Converter</h1>

                <p>
                    Convert currencies using exchange-rate data
                </p>
            </div>


            <!-- Amount -->
            <label for="amount">Amount</label>

            <input
                type="number"
                id="amount"
                value="100"
                min="0"
                step="any"
                placeholder="Enter amount"
            >


            <!-- Currency Selection -->
            <div class="currency-row">

                <div class="field">

                    <label for="fromCurrency">From</label>

                    <select id="fromCurrency">

                        <option value="INR" selected>
                            INR - Indian Rupee
                        </option>

                        <option value="USD">
                            USD - US Dollar
                        </option>

                        <option value="EUR">
                            EUR - Euro
                        </option>

                        <option value="GBP">
                            GBP - British Pound
                        </option>

                        <option value="JPY">
                            JPY - Japanese Yen
                        </option>

                        <option value="AUD">
                            AUD - Australian Dollar
                        </option>

                        <option value="CAD">
                            CAD - Canadian Dollar
                        </option>

                        <option value="CHF">
                            CHF - Swiss Franc
                        </option>

                        <option value="SGD">
                            SGD - Singapore Dollar
                        </option>

                        <option value="AED">
                            AED - UAE Dirham
                        </option>

                    </select>

                </div>


                <!-- Swap Button -->
                <button
                    id="swapBtn"
                    class="swap-btn"
                    type="button"
                >
                    ⇄
                </button>


                <div class="field">

                    <label for="toCurrency">To</label>

                    <select id="toCurrency">

                        <option value="USD" selected>
                            USD - US Dollar
                        </option>

                        <option value="INR">
                            INR - Indian Rupee
                        </option>

                        <option value="EUR">
                            EUR - Euro
                        </option>

                        <option value="GBP">
                            GBP - British Pound
                        </option>

                        <option value="JPY">
                            JPY - Japanese Yen
                        </option>

                        <option value="AUD">
                            AUD - Australian Dollar
                        </option>

                        <option value="CAD">
                            CAD - Canadian Dollar
                        </option>

                        <option value="CHF">
                            CHF - Swiss Franc
                        </option>

                        <option value="SGD">
                            SGD - Singapore Dollar
                        </option>

                        <option value="AED">
                            AED - UAE Dirham
                        </option>

                    </select>

                </div>

            </div>


            <!-- Convert Button -->
            <button
                id="convertBtn"
                class="convert-btn"
                type="button"
            >
                Convert
            </button>


            <!-- Result -->
            <div
                id="result"
                class="result"
                aria-live="polite"
            >
                Enter an amount and click Convert.
            </div>


            <!-- Exchange Rate -->
            <p
                id="rateInfo"
                class="rate-info"
            ></p>


            <p class="api-note">
                Exchange rates powered by Frankfurter API
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
